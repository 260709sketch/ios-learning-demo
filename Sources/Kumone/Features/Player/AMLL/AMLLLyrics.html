<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AMLL Lyrics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.5.2/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
  }
  /* 背景 canvas 铺满 */
  #bg-container {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  #bg-container canvas {
    width: 100% !important;
    height: 100% !important;
  }
  /* 歌词容器 */
  #lyric-container {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  /* AMLL 歌词颜色 —— 正确的 CSS 变量名 */
  .amll-lyric-player {
    --amll-lp-color: #ffffff;
    --amll-lp-hover-bg-color: rgba(255,255,255,0.08);
  }
  /* 加载提示 */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 14px;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="app">
  <div id="bg-container"></div>
  <div id="lyric-container"></div>
  <div id="loading">加载中…</div>
</div>

<script type="module">
import {
  LyricPlayer,
  BackgroundRender,
  MeshGradientRenderer,
} from 'https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.5.2/+esm';

// ─── 状态 ───────────────────────────────────────────────
let bgRender = null;
let lyricPlayer = null;
let rafId = null;
let lastTime = 0;
let isPlaying = false;
let currentTime = 0;
let isReady = false;

const loadingEl = document.getElementById('loading');
const bgContainer = document.getElementById('bg-container');
const lyricContainer = document.getElementById('lyric-container');

// ─── 初始化背景 ──────────────────────────────────────────
function initBackground() {
  bgRender = BackgroundRender.new(MeshGradientRenderer);
  bgRender.setFPS(30);
  bgRender.setFlowSpeed(8);
  bgRender.setRenderScale(0.5);
  bgContainer.appendChild(bgRender.getElement());
}

// ─── 初始化歌词播放器 ────────────────────────────────────
function initLyricPlayer() {
  lyricPlayer = new LyricPlayer();
  const el = lyricPlayer.getElement();
  el.style.width = '100%';
  el.style.height = '100%';
  // 歌词偏下显示，给顶部封面/歌曲信息留出空间
  lyricPlayer.setAlignPosition(0.62);
  lyricContainer.appendChild(el);

  // 歌词点击事件 → 通知 Swift
  lyricPlayer.addEventListener('line-click', (e) => {
    postToNative('line-click', { index: e.detail.lineIndex });
  });
}

// ─── 动画循环 ────────────────────────────────────────────
function tick(now) {
  if (!lastTime) lastTime = now;
  const delta = now - lastTime; // 毫秒（AMLL update 要求毫秒）
  lastTime = now;

  // JS 侧自己维护播放时间递增，Swift 只做周期性校准
  if (isPlaying) {
    currentTime += delta; // 毫秒
  }
  if (lyricPlayer) {
    lyricPlayer.setCurrentTime(currentTime);
    lyricPlayer.update(delta); // delta 单位：毫秒
  }

  rafId = requestAnimationFrame(tick);
}

function startLoop() {
  if (rafId) return;
  lastTime = 0;
  rafId = requestAnimationFrame(tick);
}

function stopLoop() {
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

// ─── Swift → JS 桥接接口 ─────────────────────────────────
window.amll = {
  /** 设置歌词数据（AMLL LyricLine[] 格式，时间单位毫秒） */
  setLyrics(lines) {
    if (!lyricPlayer) return;
    lyricPlayer.setLyricLines(lines || []);
  },

  /** 设置当前播放时间（秒） */
  setTime(timeSec) {
    currentTime = timeSec * 1000; // 转毫秒
  },

  /** 设置播放状态 */
  setPlaying(playing) {
    isPlaying = playing;
    if (bgRender) {
      if (playing) bgRender.resume();
      else bgRender.pause();
    }
    if (lyricPlayer) {
      if (playing) lyricPlayer.resume();
      else lyricPlayer.pause();
    }
  },

  /** 设置专辑封面（data URL 或远程 URL） */
  async setAlbum(imageUrl) {
    if (!bgRender) return;
    if (!imageUrl) return;
    try {
      await bgRender.setAlbum(imageUrl);
    } catch (err) {
      console.error('AMLL setAlbum failed:', err);
    }
  },

  /** 设置背景流动速度 */
  setFlowSpeed(speed) {
    if (bgRender) bgRender.setFlowSpeed(speed);
  },

  /** 设置背景渲染缩放（性能/质量权衡，0.3-1.0） */
  setRenderScale(scale) {
    if (bgRender) bgRender.setRenderScale(scale);
  },

  /** 设置是否有歌词（影响背景行为） */
  setHasLyric(has) {
    if (bgRender) bgRender.setHasLyric(has);
  },

  /** 设置歌词垂直位置（0.0-1.0，默认0.5居中） */
  setLyricAlignPosition(pos) {
    if (lyricPlayer) lyricPlayer.setAlignPosition(pos);
  },

  /** 跳转到指定时间（秒），isSeek=true 时强制立即布局 */
  seek(timeSec, isSeek = true) {
    currentTime = timeSec * 1000;
    if (lyricPlayer) {
      lyricPlayer.setCurrentTime(currentTime, isSeek);
    }
  },

  /** 销毁释放资源 */
  dispose() {
    stopLoop();
    if (lyricPlayer) {
      lyricPlayer.dispose?.();
      lyricPlayer = null;
    }
    if (bgRender) {
      bgRender.dispose();
      bgRender = null;
    }
  },
};

// ─── JS → Swift 通知 ─────────────────────────────────────
function postToNative(name, data) {
  if (window.webkit?.messageHandlers?.amllEvent) {
    window.webkit.messageHandlers.amllEvent.postMessage({ name, data });
  }
}

// ─── 启动 ────────────────────────────────────────────────
try {
  initBackground();
  initLyricPlayer();
  startLoop();
  isReady = true;
  loadingEl.style.display = 'none';
  postToNative('ready', {});
} catch (err) {
  loadingEl.textContent = '加载失败: ' + err.message;
  postToNative('error', { message: err.message });
  console.error('AMLL init error:', err);
}
</script>
</body>
</html>
